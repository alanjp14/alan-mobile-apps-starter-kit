name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # No dependencies — tool/validate.mjs is pure Node.
      - name: Validate (JSON syntax · broken links · empty files · duplicates · stale refs)
        run: node tool/validate.mjs

      - name: Check design tokens parse
        run: |
          for f in design-tokens/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8')); console.log('ok  $f')"
          done

      - name: No hard-coded hex in component/screen docs prose
        run: |
          # tokens.json, design-tokens/*.json and the platform files legitimately hold hex.
          # Everywhere else, hex should appear only in a code span/block or a contrast table.
          if grep -rInE '(^|[^\`#-])#[0-9A-Fa-f]{6}([^0-9A-Fa-f]|$)' docs \
              | grep -vE 'dark-mode\.md|color-system\.md|accessibility\.md|specs/dashboard\.md|`#' \
              | grep -vE '^\S+\.md:[0-9]+:\s*\|' ; then
            echo "::warning::raw hex found outside allowed files — prefer a semantic token name"
          fi
