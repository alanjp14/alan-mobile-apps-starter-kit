name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Validate docs & tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate repository (links · JSON · empty files · duplicates)
        run: node tool/validate.mjs
      - name: Design-token JSON parses
        run: for f in design-tokens/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"; done

  flutter:
    name: Flutter — analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Token generator is up to date
        run: |
          node tool/build_tokens.mjs
          git diff --exit-code packages/amds_tokens/lib/src/tokens.dart \
            || (echo "::error::amds_tokens is stale — run 'node tool/build_tokens.mjs' and commit" && exit 1)

      - name: Resolve workspace
        run: flutter pub get

      - name: Melos bootstrap
        run: dart pub global activate melos && melos bootstrap

      - name: Format check (advisory in v1.0 — run `melos run format` locally)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed packages apps widgetbook

      - name: Analyze
        run: melos run analyze

      - name: Test (Flutter — includes Alchemist CI goldens)
        run: melos run test

      - name: Test (pure Dart)
        run: melos run test:dart
