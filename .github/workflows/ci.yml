name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Validate docs & tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate repository (links · JSON · empty files · duplicates)
        run: node tool/validate.mjs
      - name: Design-token JSON parses
        run: for f in design-tokens/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"; done

  flutter:
    name: Flutter — analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # pin so `dart format` / analyzer output matches what baselines were
          # generated with — bump deliberately alongside a reformat commit
          flutter-version: 3.44.8
          channel: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Dart pub workspace: one `pub get` at the root resolves every package.
      # No `melos bootstrap` (Melos is just a local task runner).
      - name: Resolve workspace
        run: flutter pub get

      - name: Token generator is up to date
        # after `pub get` so `dart format` sees each package's language version
        # (amds_tokens is `sdk: ^3.6.0` → the short style) via package_config.json
        run: |
          node tool/build_tokens.mjs
          dart format packages/amds_tokens/lib/src/tokens.dart
          git diff --exit-code packages/amds_tokens/lib/src/tokens.dart \
            || (echo "::error::amds_tokens is stale — run 'melos run tokens' and commit" && exit 1)

      - name: Format check (advisory in v1.0 — run `melos run format` locally)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed packages apps widgetbook

      - name: Analyze
        run: dart analyze .

      - name: Test (Flutter — includes Alchemist CI goldens)
        run: |
          set -e
          for d in packages/amds_motion packages/amds_ui apps/starter apps/_template; do
            echo "::group::flutter test $d" && (cd "$d" && flutter test) && echo "::endgroup::"
          done

      - name: Test (pure Dart)
        run: cd packages/amds_core && dart test
