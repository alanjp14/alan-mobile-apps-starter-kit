# Shared analysis config for the AMDS Flutter workspace.
# Individual packages include this file.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # generated token file — don't nag about ordering/const in machine output
    todo: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # NOTE: `require_trailing_commas` is intentionally omitted — the Dart 3.7+
    # "tall" formatter owns comma/wrapping decisions and fights that lint.
    - always_declare_return_types
    - avoid_print
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_final_locals
    - prefer_single_quotes
    - sort_child_properties_last
    - unawaited_futures
    - use_key_in_widget_constructors
