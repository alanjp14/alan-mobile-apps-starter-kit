name: app_template
description: AMDS clean-architecture starter — clone this folder to begin a new app.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  amds_ui: any
  amds_core: any
  app_config: any
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  intl: ^0.19.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
