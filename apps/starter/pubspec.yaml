name: starter
description: AMDS reference app — a runnable showcase of the design system on mock data.
version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  amds_ui:
    path: ../../packages/amds_ui
  amds_core:
    path: ../../packages/amds_core
  app_config:
    path: ../../packages/app_config

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
