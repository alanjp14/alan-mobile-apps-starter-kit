name: amds_ui
description: AMDS v1.0 Flutter component library — Amds* widgets, adaptive layout, motion, and state screens.
version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  amds_tokens:
    path: ../amds_tokens
  amds_motion:
    path: ../amds_motion

dev_dependencies:
  alchemist: ^0.12.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
