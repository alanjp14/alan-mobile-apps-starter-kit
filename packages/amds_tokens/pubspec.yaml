name: amds_tokens
description: Alan Mobile Design System (AMDS) design tokens for Flutter — palette, scales, typography, motion, and ThemeData.
version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0

# To bundle Inter (recommended — it ships on no OS):
# 1. download the Inter static weights (OFL) into packages/amds_tokens/fonts/
# 2. uncomment the block below
# Until then Flutter falls back to the platform sans; the design still holds.
#
# flutter:
#   fonts:
#     - family: Inter
#       fonts:
#         - asset: fonts/Inter-Regular.ttf
#         - asset: fonts/Inter-Medium.ttf
#           weight: 500
#         - asset: fonts/Inter-SemiBold.ttf
#           weight: 600
#         - asset: fonts/Inter-Bold.ttf
#           weight: 700
